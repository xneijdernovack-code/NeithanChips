name: Scanner Value en Crisis

on:
  workflow_dispatch: {}          # correr a mano desde la pestana Actions
  push:
    branches: [ main ]           # (temporal) cada push a main lo corre
  schedule:
    - cron: "0 22 * * 1-5"       # 22:00 UTC (5pm Lima / despues del cierre de NY), lun-vie

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr scanner
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python scanner.py --stage news

      - name: Preparar carpeta publica
        run: |
          mkdir -p public
          cp salida/index.html public/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
